[project]
name = "ctf-agent"
version = "0.1.0"
description = "Tool-using LLM agent for the NYU CTF Challenge (CYBERSEC 590)"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.8.0",
    "langchain-openai>=1.7.4",
    "langsmith>=0.14.17",
    "textual>=8.2.8",
    "textual-plotext>=1.0.1",
    "flask>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
bench = [
    "nyuctf",
]

[project.scripts]
ctf-agent = "ctf_agent.cli:main"
ctf-flask-gui = "ctf_agent.flask_gui:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
